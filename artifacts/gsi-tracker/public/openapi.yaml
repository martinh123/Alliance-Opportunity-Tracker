          type: array
          items:
            $ref: "#/components/schemas/ContactImportRow"

    BulkContactImportResult:
      type: object
      required: [inserted, skipped, errors]
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    BackupData:
      type: object
      required: [tables]
      properties:
        version:
          type: string
        exportedAt:
          type: string
        tables:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true

    BackupActionResult:
      type: object
      required: [ok]
      properties:
