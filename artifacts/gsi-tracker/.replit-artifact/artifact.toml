kind = "web"
previewPath = "/"
title = "GSI Partner Opportunity Tracker"
version = "1.0.0"
id = "artifacts/gsi-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19844

[services.development]
run = "pnpm --filter @workspace/gsi-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gsi-tracker", "run", "build" ]
publicDir = "artifacts/gsi-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19844"
BASE_PATH = "/"
