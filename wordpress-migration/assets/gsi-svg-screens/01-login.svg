<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">GSI Tracker Login</title><desc id="desc">GSI Partner Opportunity Tracker screen reference for /login.</desc><style>text{font-family:Inter,Arial,sans-serif} .small{font-size:12px}.tiny{font-size:10px}.body{font-size:14px}.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase}.h1{font-size:20px;font-weight:700}.h2{font-size:16px;font-weight:700}.muted{fill:#64748b}.line{stroke:#e2e8f0;stroke-width:1}.shadow{filter:url(#shadow)}</style><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="720" height="1000" rx="0" fill="#0f172a" stroke="none" stroke-width="1" class=""/><rect x="720" y="0" width="720" height="1000" rx="0" fill="#f8fafc" stroke="none" stroke-width="1" class=""/><text x="48" y="60" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">ALLIANCE SALES</text><text x="48" y="96" font-size="24" fill="#e2e8f0" font-weight="700" text-anchor="start">GSI Tracker</text><text x="48" y="412" font-size="18" fill="#a9b5c8" font-weight="400" text-anchor="start">&quot;One platform to qualify, track, and close your most complex GSI partner</text><text x="48" y="440" font-size="18" fill="#a9b5c8" font-weight="400" text-anchor="start">deals — built around MEDDPICC.&quot;</text><rect x="48" y="488" width="304" height="70" rx="7" fill="#17213a" stroke="#263452" stroke-width="1" class=""/><text x="64" y="515" font-size="12" fill="#3b82f6" font-weight="600" text-anchor="start">Pipeline Visibility</text><text x="64" y="537" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Real-time rollup across all partners</text><rect x="368" y="488" width="304" height="70" rx="7" fill="#17213a" stroke="#263452" stroke-width="1" class=""/><text x="384" y="515" font-size="12" fill="#3b82f6" font-weight="600" text-anchor="start">MEDDPICC Built-In</text><text x="384" y="537" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">8 qualification layers per deal</text><rect x="48" y="574" width="304" height="70" rx="7" fill="#17213a" stroke="#263452" stroke-width="1" class=""/><text x="64" y="601" font-size="12" fill="#3b82f6" font-weight="600" text-anchor="start">Deal Scoring</text><text x="64" y="623" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Completeness health at a glance</text><rect x="368" y="574" width="304" height="70" rx="7" fill="#17213a" stroke="#263452" stroke-width="1" class=""/><text x="384" y="601" font-size="12" fill="#3b82f6" font-weight="600" text-anchor="start">Partner-centric</text><text x="384" y="623" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Opportunities &amp; initiatives per GSI</text><text x="48" y="948" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">Built for VP-level alliance &amp; partner sales teams</text><text x="888" y="410" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Sign in</text><text x="888" y="442" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Access your GSI partner pipeline</text><text x="888" y="496" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">Email</text><rect x="888" y="506" width="384" height="38" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1" class=""/><text x="900" y="530" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">you@company.com</text><text x="888" y="580" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start">Password</text><rect x="888" y="590" width="384" height="38" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1" class=""/><text x="900" y="614" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">••••••••</text><rect x="888" y="642" width="384" height="34" rx