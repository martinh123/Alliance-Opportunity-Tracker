<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">GSI Tracker Route Map</title><desc id="desc">Application route map for the GSI Partner Opportunity Tracker with public, protected, admin, and API route groups.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".1"/></filter></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f8fafc" stroke="none" stroke-width="1"/><text x="56" y="58" font-family="Inter,Arial,sans-serif" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">GSI Partner Opportunity Tracker</text><text x="56" y="88" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Application route map · React/Vite web app · WordPress rebuild reference</text><rect x="1250" y="33" width="280" height="44" rx="8" fill="#0f172a" stroke="none" stroke-width="1"/><text x="1390" y="60" font-family="Inter,Arial,sans-serif" font-size="12" fill="#e2e8f0" font-weight="700" text-anchor="middle">BASE: /gsi-tracker</text><rect x="56" y="120" width="1488" height="54" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="76" y="152" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">ROUTE GROUPS</text><rect x="226" y="137" width="14" height="14" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/><text x="248" y="149" font-family="Inter,Arial,sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Public</text><rect x="336" y="137" width="14" height="14" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="358" y="149" font-family="Inter,Arial,sans-serif" font-